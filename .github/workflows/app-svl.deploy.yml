# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Deploy
run-name: ${{inputs.operation}} - ${{inputs.environment}}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment Name
        type: choice
        default: ADT
        options:
          - ADT
          - QAT
          - PRD
      operation:
        description: Operation
        type: choice
        default: apply
        options:
          - plan
          - apply
          - destroy
      infrastructure_only:
        description: Infrastructure Only
        type: boolean
        default: false

jobs:
  plan:
    if: ${{inputs.operation == 'plan'}}
    runs-on: ubuntu-latest
    name: Plan
    environment: ${{inputs.environment}}
    env:
      ARM_CLIENT_ID: ${{secrets.ARM_CLIENT_ID}}
      ARM_CLIENT_SECRET: ${{secrets.ARM_CLIENT_SECRET}}
      ARM_SUBSCRIPTION_ID: ${{secrets.AZURE_SUB_ID}}
      ARM_TENANT_ID: ${{secrets.AZURE_TENANT_ID}}
      TF_VAR_arm_client_id: ${{secrets.ARM_CLIENT_ID}}
      TF_VAR_arm_client_secret: ${{secrets.ARM_CLIENT_SECRET}}
      TF_VAR_app_client_id: ${{secrets.APP_CLIENT_ID}}
      TF_VAR_app_post_logout_redirect: ${{vars.POST_LOGOUT_REDIRECT_URI}}
      TF_VAR_app_redirect_uri: ${{vars.REDIRECT_URI}}
      TF_VAR_app_session_secret: ${{secrets.APP_SESSION_SECRET}}
      TF_VAR_api_root: ${{vars.API_ROOT}}
      TF_VAR_app_client_secret: ${{secrets.APP_CLIENT_SECRET}}
      TF_VAR_app_plan_sku: ${{vars.APP_PLAN_SKU}}
      TF_VAR_env_name: ${{vars.ENV_NAME}}
      TF_VAR_global_resource_group_location: ${{vars.GLOBAL_RESOURCE_GROUP_LOCATION}}
      TF_VAR_login_record_ttl: ${{vars.LOGIN_RECORD_TTL}}
      TF_VAR_resource_group_location: ${{vars.RESOURCE_GROUP_LOCATION}}

    steps:
      - uses: actions/checkout@v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.5"

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUB_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Initialize Terraform
        run: terraform init -backend-config="key=svl.${{vars.ENV_NAME}}.tfstate"

      - name: Plan Terraform
        run: terraform plan -input=false -out=tfplan

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: ${{inputs.operation != 'plan'}}
    runs-on: ubuntu-latest
    name: Deploy
    environment: ${{inputs.environment}}
    env:
      ARM_CLIENT_ID: ${{secrets.ARM_CLIENT_ID}}
      ARM_CLIENT_SECRET: ${{secrets.ARM_CLIENT_SECRET}}
      ARM_SUBSCRIPTION_ID: ${{secrets.AZURE_SUB_ID}}
      ARM_TENANT_ID: ${{secrets.AZURE_TENANT_ID}}
      TF_VAR_arm_client_id: ${{secrets.ARM_CLIENT_ID}}
      TF_VAR_arm_client_secret: ${{secrets.ARM_CLIENT_SECRET}}
      TF_VAR_app_client_id: ${{secrets.APP_CLIENT_ID}}
      TF_VAR_app_post_logout_redirect: ${{vars.POST_LOGOUT_REDIRECT_URI}}
      TF_VAR_app_redirect_uri: ${{vars.REDIRECT_URI}}
      TF_VAR_app_session_secret: ${{secrets.APP_SESSION_SECRET}}
      TF_VAR_api_root: ${{vars.API_ROOT}}
      TF_VAR_app_client_secret: ${{secrets.APP_CLIENT_SECRET}}
      TF_VAR_app_plan_sku: ${{vars.APP_PLAN_SKU}}
      TF_VAR_env_name: ${{vars.ENV_NAME}}
      TF_VAR_global_resource_group_location: ${{vars.GLOBAL_RESOURCE_GROUP_LOCATION}}
      TF_VAR_login_record_ttl: ${{vars.LOGIN_RECORD_TTL}}
      TF_VAR_resource_group_location: ${{vars.RESOURCE_GROUP_LOCATION}}

    steps:
      - uses: actions/checkout@v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.5"

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUB_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Initialize Terraform
        run: terraform init -backend-config="key=svl.${{vars.ENV_NAME}}.tfstate"

      - name: Reject PRD destroy
        if: ${{inputs.operation == 'destroy' && inputs.environment == 'PRD'}}
        run: |
          echo "Destroy is disabled for PRD."
          exit 1

      - name: Terraform Apply
        if: ${{inputs.operation == 'apply'}}
        run: terraform apply -auto-approve

      - name: Terraform Destroy
        if: ${{inputs.operation == 'destroy' && inputs.environment != 'PRD'}}
        run: terraform destroy -auto-approve

      - name: Setup Node 24.x
        if: ${{inputs.operation == 'apply' && !inputs.infrastructure_only}}
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install NPM Dependencies
        if: ${{inputs.operation == 'apply' && !inputs.infrastructure_only}}
        run: |
          npm install
        working-directory: src

      - name: 'Deploy to Azure Web App'
        if: ${{inputs.operation == 'apply' && !inputs.infrastructure_only}}
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-svl-${{vars.ENV_NAME}}-${{vars.RESOURCE_GROUP_LOCATION}}
          package: src
